# DeepSeek V4.1 Flash via OpenRouter -- the c-repair API preset.
# Derived from the CertFix bundled profile with c-repair adjustments.
# The filename and internal deepseek_v4_flash role/profile IDs are retained for
# compatibility; the API model IDs below select the current release's model.
#
# Required environment:
#
#   export OPENROUTER_API_KEY=...
#
# OpenRouter provides one BYOK key for model/provider selection (D-018).
# Earlier DeepSeek V4 Flash measurements are recorded in docs/DECISIONS.md;
# those results do not establish quality or reasoning behavior for V4.1 Flash.
#
# Source code is sent to the routed provider (DeepInfra) via OpenRouter.
# The extension shows an external-route notice before the first scan.

detection:
  backend: api
  prompt_profile: qwen36_certfix_check_v1
  batch_size: 1
  qwen36_rule_id_strategy: sequential_top2_p3
  qwen36_selector_candidate_k: 2
  qwen36_selector_permutations: 3
  api:
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4.1-flash
    api_key_env: OPENROUTER_API_KEY
    timeout: 120
    max_tokens: 1024
    temperature: 0.0
    retry_attempts: 8
    retry_initial_delay: 5.0
    retry_max_delay: 90.0
    extra_body:
      provider:
        order: ["DeepInfra"]
        allow_fallbacks: false
      # Shared with repair; send-time conversion reserves thinking + answer tokens.
      reasoning:
        effort: xhigh

models:
  deepseek_v4_flash:
    backend: api
    profile: deepseek_v4_flash
    max_tokens: 8192
    temperature: 0.0
    api:
      base_url: https://openrouter.ai/api/v1
      model: deepseek/deepseek-v4.1-flash
      api_key_env: OPENROUTER_API_KEY
      timeout: 300
      max_tokens: 8192
      temperature: 0.0
      retry_attempts: 8
      retry_initial_delay: 5.0
      retry_max_delay: 90.0
      extra_body:
        provider:
          order: ["DeepInfra"]
          allow_fallbacks: false
        # Repair and violation detection share this reasoning level.
        # Declaration completion (/context/infer) remains reasoning off.
        #
        # D-034: the bridge converts effort to a thinking-token cap before
        # sending (max=32768 / xhigh=24576 / high=16384 / medium=8192 /
        # low=4096 / minimal=1024; off stays {enabled: false}). The completion
        # budget includes the cap plus the answer allowance. Whether a provider
        # honors the cap depends on the model/provider implementation.
        reasoning:
          effort: xhigh

validation:
  compile:
    enabled: true
    command: gcc
    args: ["-fsyntax-only"]
    include_paths: []
    timeout: 30
  violation_removal:
    enabled: true
    detector_role: deepseek_v4_flash
    method: non_target_advisory
    max_tokens: 4096
    override_denylist: ["SIG34-C", "STR31-C"]
  semantic:
    enabled: true
    reviewer_role: deepseek_v4_flash
    block_on_uncertain: true

fix:
  simple_repairer_role: deepseek_v4_flash
  simple_repair_profile: qwen36_27b_complete_repair_rule_guided_v1
  simple_max_tokens: 8192
  validate_guided_retry: true
  retry_max_attempts: 1
  retry_max_tokens: 8192
  retry_rule_addenda_v1: true
  retry_rule_addenda_rule_ids: ["ARR37-C", "CON31-C", "POS48-C", "SIG30-C", "ENV33-C"]
